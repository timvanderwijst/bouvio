[package]
name = "cuna-runner-cli"
description = "Headless Cuna runner: the same core as the desktop app, for a VPS or for testing"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cuna-runner"
path = "src/main.rs"

[dependencies]
cuna-protocol.workspace = true
cuna-runner.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
