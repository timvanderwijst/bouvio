[workspace]
resolver = "2"
members = ["crates/protocol", "crates/runner", "crates/agent", "apps/runner-cli", "apps/desktop/src-tauri", "apps/hub"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/timvanderwijst/bouvio"

[workspace.dependencies]
cuna-protocol = { path = "crates/protocol" }
cuna-runner = { path = "crates/runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
ts-rs = { version = "11", features = ["serde-json-impl", "uuid-impl", "chrono-impl"] }
