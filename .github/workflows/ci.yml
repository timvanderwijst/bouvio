name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri and the keychain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libsoup-3.0-dev libdbus-1-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The desktop crate embeds the built UI; tests only need the folder to exist.
      - name: Placeholder UI build
        run: mkdir -p apps/desktop/dist && echo '<!doctype html><title>Bouvio</title>' > apps/desktop/dist/index.html

      - run: cargo test --workspace --locked

  web:
    name: TypeScript and web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @bouvio/desktop typecheck

      - name: Web client tests
        run: pnpm --filter @bouvio/desktop test:web

      - name: Web client build
        run: pnpm --filter @bouvio/desktop build:web
