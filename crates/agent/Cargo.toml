[package]
name = "cuna-agent"
description = "Cuna's own agent loop, tools, model listing and media generation for API keys"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cuna-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"
regex = "1"
ignore = "0.4"
globset = "0.4"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
