[package]
name = "bouvio-runner"
description = "Runs agent harnesses, terminals and worktrees for Bouvio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bouvio-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
portable-pty = "0.9"
which = "7"
dirs = "6"
async-trait = "0.1"
croner = "2"
base64 = "0.22"
ignore = "0.4"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
